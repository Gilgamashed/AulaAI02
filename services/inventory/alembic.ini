[alembic]
# Localização do script de migração e do diretório de versões (relativo ao
# working dir do serviço, /app no container).
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

# A URL real é injetada via DATABASE_URL no env.py (docker-compose). Mantemos
# vazia aqui porque o inventário compartilha o banco com o Django e a URL é
# sensível ao ambiente.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S