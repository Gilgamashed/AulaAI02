                $ref: "#/components/schemas/CacheMetrics"
              example:
                cache_habilitado: true
                redis:
                  url: redis://***@localhost:6379/0
                  key_prefix: synapse
                  ttl_lista_s: 60
                  ttl_detalhe_s: 300
                total:
                  hit: 12
                  miss: 3
                  lookups: 15
                namespaces:
                  categoria:lista:
                    hit: 10
                    miss: 1
                  categoria:detalhe:
                    hit: 2
                    miss: 2
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/assist:
    post:
      operationId: assistLogs
      summary: Sumariza ou explica logs operacionais via IA (Aula 14)
      description: |
        Envia logs para o `llm_service` e devolve o texto gerado mais o
        consumo de tokens. Exige JWT (autenticado de qualquer papel); o
        throttling global `user` atua como cota de custo.

        **Privacidade:** antes de chegar ao provedor, o conteúdo passa pela
        política de redação do `llm_service` (PII/segredos viram placeholders);
        a resposta também é redigida. **Limites:** `logs` aceita string ou
        array (máx. 100.000 caracteres, sem itens vazios); `temperature` entre
        0.0 e 1.0 (padrão 0.2) e `max_tokens` entre 1 e 4096 (padrão 256).
      tags:
        - assist
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistRequest"
            example:
              mode: explain
              logs:
                - "pedido 42 falhou no pagamento"
                - "timeout ao consultar o gateway"
              temperature: 0.2
              max_tokens: 256
      responses:
        "200":
          description: Geração concluída com o consumo de tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistResponse"
              example:
                answer: |
                  O pedido 42 falhou no pagamento por timeout no gateway. Próximo
                  passo recomendado: verificar a latência do provedor de pagamento.
                meta:
                  tokens_prompt: 42
                  tokens_output: 96
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailableLlm"

  /api/v1/llm/metrics/:
    get:
      operationId: metricasLlm
      summary: Telemetria do provedor de IA (apenas admin)
      description: |
        Snapshot dos contadores do `llm_service` no processo (desfechos,
        chamadas bloqueadas pelo circuit breaker, tokens, custo estimado e
        latência média) com a configuração efetiva. Restrito ao papel `admin`.
      tags:
        - llm
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Métricas e configuração do provedor de IA.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LlmMetrics"
              example:
                provedor: mock
                modelo: mock
                timeout_segundos: 5.0
                redacao_ativa: true
                custo_por_1m_tokens:
                  input_usd: 5.0
                  output_usd: 15.0
                total:
                  chamadas: 10
                  bloqueadas: 1
                  sucessos: 9
                  falhas: 1
                  terminais: 0
                  tokens_prompt: 800
                  tokens_output: 1200
                  custo_usd: 0.022
                  taxa_erro: 0.1
                  latencia_media_ms: 120.5
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

