openapi: 3.1.0
info:
  title: SynapseShop API
  version: 1.14.0
  description: |
    Documentação OpenAPI do MVP SynapseShop (Aula 14).

    Contrato da API principal (`api/` — Django REST Framework) e do
    microsserviço complementar de estoque (`services/inventory/` — FastAPI).

    A Aula 14 adicionou o assistente de IA (`POST /api/v1/assist`) e a
    telemetria do provedor (`GET /api/v1/llm/metrics/`).

    ## Convenções de contrato

    * **Erros padronizados (RFC 7807 / `application/problem+json`):** todas as
      respostas de erro usam o esquema `ErrorSchema` (`type`, `title`, `status`,
      `detail`, `instance`). As extensões `code` e `errors` (validação por campo)
      são membros permitidos pela norma. Nota de implementação: a API ainda
      devolve hoje o formato padrão do DRF (`{"detail": "..."}` / dicionário por
      campo) e o envelope `{"status","data","message"}` no inventory; o
      `application/problem+json` é o **contrato-alvo** desta especificação.
    * **Paginação:** listagens usam `?page=<n>` e `?limit=<n>` (padrão 20,
      máximo 100) e devolvem `{count, next, previous, nextCursor, results}`.
      `nextCursor` é o cursor opaco para a próxima página (contrato-alvo).
      Nota de implementação: hoje a API usa `PageNumberPagination` do DRF
      (`?page=<n>`, `PAGE_SIZE=20`) e devolve apenas
      `{count, next, previous, results}`; `limit` e `nextCursor` fazem parte do
      **contrato-alvo** desta especificação.
    * **Filtros:** filtros por query param (`?status=`, `?category=`,
      `?is_active=`, `?min_price=`, `?max_price=`, `?canal=`, `?pedido=`),
      conforme documentado em cada operação.
    * **Ordenação:** sintaxe estandardizada `?sort=<campo>:<direcao>`, ex.:
      `?sort=createdAt:desc`. Múltiplos campos separados por vírgula.
      Nota de implementação: hoje a API usa o `OrderingFilter` do DRF
      (`?ordering=created_at,-created_at`); `sort=<campo>:<dir>` é o
      **contrato-alvo** (envio equivalente: `?ordering=-created_at`).
    * **Status codes:** respostas de sucesso `2xx` (`200`, `201`, `204`);
      erros de cliente `4xx` (`400`, `401`, `403`, `404`, `409`, `429`) com
      corpo em `ErrorSchema`; indisponibilidade de infraestrutura `5xx` (`503`).
    * **Cabeçalhos obrigatórios:** `Authorization: Bearer <JWT>` em todas as
      rotas autenticadas; `Idempotency-Key` (opcional, ≤ 64 chars) no
      `POST /api/v1/pedidos/`; **`X-Trace-Id`** (UUID) **obrigatório** em todas
      as rotas de negócio autenticadas para rastreio distribuído — é um
      contrato-alvo: a implementação atual ainda não o valida nem o propaga.
      `X-Simular-Falha` é exclusivo de desenvolvimento.
  contact:
    name: SynapseShop
  license:
    name: Proprietário do curso

servers:
  - url: http://localhost:8000
    description: API principal (Django REST Framework)

tags:
  - name: health
    description: Healthchecks dos serviços
  - name: auth
    description: Autenticação JWT (SimpleJWT)
  - name: categories
    description: Categorias do catálogo
  - name: items
    description: Itens (produtos) do catálogo
  - name: pedidos
    description: Pedidos e pagamentos (fluxo assíncrono via mensageria)
  - name: notificacoes
    description: Notificações geradas pelo worker
  - name: cache
    description: Métricas operacionais do cache
  - name: assist
    description: Assistente de IA (sumariza/explica logs operacionais)
  - name: llm
    description: Telemetria do provedor de IA (admin)
  - name: inventory
    description: Microsserviço de estoque (FastAPI)

paths:
  /health:
    servers:
      - url: http://localhost:8000
        description: Healthcheck da API principal
      - url: http://localhost:8001
        description: Healthcheck do inventory
    get:
      operationId: healthcheckServicos
      summary: Healthcheck dos serviços
      description: |
        Saúde dos serviços. Na API principal (`:8000`) devolve também o broker
        ativo e o resumo dos fluxos de mensageria; no inventory (`:8001`)
        devolve apenas o estado mínimo.
      tags:
        - health
      responses:
        "200":
          description: Serviço saudável
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/HealthApi"
                  - $ref: "#/components/schemas/HealthInventory"

  /api/v1/auth/token/:
    post:
      operationId: obterToken
      summary: Emitir par access/refresh (login)
      description: |
        Autentica com `username`/`password` e devolve o par de tokens JWT.
        Endpoint com throttling dedicado (`5/min` por cliente).
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenObtain"
            example:
              username: caio
              password: secret
      responses:
        "200":
          description: Autenticação bem-sucedida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
              example:
                access: eyJhbGciOiJIUzI1NiIs...
                refresh: eyJhbGciOiJIUzI1NiIs...
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/token/refresh/:
    post:
      operationId: renovarToken
      summary: Trocar refresh token por access token novo
      description: Endpoint com throttling dedicado (`5/min` por cliente).
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefresh"
            example:
              refresh: eyJhbGciOiJIUzI1NiIs...
      responses:
        "200":
          description: Access token renovado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRefreshResponse"
              example:
                access: eyJhbGciOiJIUzI1NiIs...
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/token/verify/:
    post:
      operationId: verificarToken
      summary: Verificar validade de um token
      description: Devolve 200 se o token for válido; caso contrário, 401.
      tags:
        - auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenVerify"
            example:
              token: eyJhbGciOiJIUzI1NiIs...
      responses:
        "200":
          description: Token válido
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/categories/:
    get:
      operationId: listarCategorias
      summary: Listar categorias (público)
      description: |
        Listagem paginada de categorias com `items_count`. Suporta busca
        (`?search=name,slug`) e ordenação estandardizada
        (`?sort=name:asc`, `?sort=createdAt:desc`). Público, com cache-aside
        (TTL de listagem).
      tags:
        - categories
      security: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: Lista paginada de categorias
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryPaginated"
              example:
                count: 2
                next: null
                previous: null
                results:
                  - id: 1
                    name: Eletrônicos
                    slug: eletronicos
                    description: Aparelhos eletrônicos
                    items_count: 3
                    created_at: "2026-08-01T10:00:00Z"
                    updated_at: "2026-08-01T10:00:00Z"
    post:
      operationId: criarCategoria
      summary: Criar categoria
      description: Requer autenticação (qualquer usuário autenticado).
      tags:
        - categories
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XTraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreate"
            example:
              name: Eletrônicos
              description: Aparelhos eletrônicos
      responses:
        "201":
          description: Categoria criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
              example:
                id: 1
                name: Eletrônicos
                slug: eletronicos
                description: Aparelhos eletrônicos
                items_count: 0
                created_at: "2026-08-01T10:00:00Z"
                updated_at: "2026-08-01T10:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/categories/{id}/:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: detalharCategoria
      summary: Detalhar categoria (público)
      description: Cache-aside de detalhe (TTL 300s).
      tags:
        - categories
      security: []
      responses:
        "200":
          description: Categoria encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: substituirCategoria
      summary: Atualizar categoria (apenas admin)
      description: Substituição completa (PUT). Requer papel admin.
      tags:
        - categories
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XTraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreate"
      responses:
        "200":
          description: Categoria atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: atualizarCategoriaParcial
      summary: Atualizar categoria parcialmente (apenas admin)
      description: Atualização parcial dos campos fornecidos (PATCH). Requer papel admin.
      tags:
        - categories
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XTraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdate"
      responses:
        "200":
          description: Categoria atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removerCategoria
      summary: Remover categoria (apenas admin)
      description: Remove a categoria. Requer papel admin.
      tags:
        - categories
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XTraceId"
      responses:
        "204":
          description: Categoria removida
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/items/:
    get:
      operationId: listarItens
      summary: Listar itens do catálogo (público)
      description: |
        Listagem paginada de produtos. Suporta filtros
        (`?category=`, `?is_active=`, `?min_price=`, `?max_price=`), busca
        (`?search=name,brand,model,sku`) e ordenação estandardizada
        (`?sort=name:asc`, `?sort=price:desc`, `?sort=createdAt:desc`).
        Público, com cache-aside.
      tags:
        - items
      security: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/IsActiveFilter"
        - $ref: "#/components/parameters/MinPriceFilter"
        - $ref: "#/components/parameters/MaxPriceFilter"
      responses:
        "200":
          description: Lista paginada de itens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemPaginated"
              example:
                count: 1
                next: null
                previous: null
                results:
                  - id: 1
                    name: iPhone 15 128GB
                    brand: Apple
                    model: iPhone 15
                    sku: APL-IP15-128
                    description: Smartphone
                    price: "3999.00"
                    specifications:
                      cor: Preto
                    warranty_months: 12
                    category: 1
                    category_name: Eletrônicos
                    is_active: true
                    created_at: "2026-08-02T10:00:00Z"
                    updated_at: "2026-08-02T10:00:00Z"
    post:
      operationId: criarItem
      summary: Criar item (autenticado)
      description: Requer autenticação.
      tags:
        - items
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XTraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemCreate"
            example:
              name: iPhone 15 128GB
              brand: Apple
              model: iPhone 15
              sku: APL-IP15-128
              description: Smartphone
              price: 3999.0
              specifications:
                cor: Preto
              warranty_months: 12
              category: 1
              is_active: true
      responses:
        "201":
          description: Item criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/items/{id}/:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: detalharItem
      summary: Detalhar item (público)
      description: Cache-aside de detalhe (TTL 300s).
      tags:
        - items
      security: []
      responses:
        "200":
          description: Item encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: substituirItem
      summary: Atualizar item (apenas admin)
      description: Substituição completa do item (PUT). Requer papel admin.
      tags:
        - items
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XTraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemCreate"
      responses:
        "200":
          description: Item atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: atualizarItemParcial
      summary: Atualizar item parcialmente (apenas admin)
      description: Atualização parcial dos campos fornecidos (PATCH). Requer papel admin.
      tags:
        - items
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XTraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemUpdate"
      responses:
        "200":
          description: Item atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removerItem
      summary: Remover item (apenas admin)
      description: Remove o item do catálogo. Requer papel admin.
      tags:
        - items
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XTraceId"
      responses:
        "204":
          description: Item removido
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/items/{id}/detalhes/:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: detalhesNegocioItem
      summary: Consulta pesada de detalhes do item (público)
      description: |
        Devolve o item com a categoria (resumo), estatísticas da categoria
        (total, preço médio/mínimo/máximo), os 3 itens mais caros e os 3 mais
        recentes da mesma categoria. Cache próprio (TTL 300s).
      tags:
        - items
      security: []
      responses:
        "200":
          description: Detalhes completos do item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDetalhe"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/pedidos/:
    get:
      operationId: listarPedidos
      summary: Listar pedidos (autenticado)
      description: |
        Listagem paginada. Usuários comuns veem apenas os próprios pedidos;
        admins veem todos. Busca por `status`/`idempotency_key`
        (`?search=`), filtro estandardizado por estado (`?status=pendente`) e
        ordenação (`?sort=createdAt:desc`, `?sort=total:desc`,
        `?sort=status:asc`).
      tags:
        - pedidos
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/StatusFilter"
        - $ref: "#/components/parameters/XTraceId"
      responses:
        "200":
          description: Lista paginada de pedidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PedidoPaginated"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: criarPedido
      summary: Criar pedido e publicar PedidoCriado (autenticado)
      description: |
        Cria o pedido a partir das linhas do request (apenas SKU e quantidade;
        o preço é lido do catálogo no servidor) e publica o evento
        `PedidoCriado` de forma assíncrona.

        * **Idempotência:** header `Idempotency-Key` (opcional, ≤ 64 chars; se
          ausente, é derivado um SHA-256 canônico do pedido). Mesma chave e
          mesmos dados → `200` com `evento.duplicado=true`; mesma chave e
          pedido diferente → `409`.
        * **`X-Simular-Falha`:** opcional (desenvolvimento), força a falha do
          worker para validar a DLQ.
        * **Limites:** até 50 linhas, SKUs únicos, quantidade 1–999.
        * **503:** pedido criado mas o broker não publicou o evento (fica em
          `pendente_publicacao`, republicável via `manage.py republicar_pedidos`).
      tags:
        - pedidos
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/XSimularFalha"
        - $ref: "#/components/parameters/XTraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PedidoCreate"
            example:
              itens:
                - sku: APL-IP15-128
                  quantidade: 2
      responses:
        "201":
          description: Pedido criado e evento publicado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pedido"
                  - type: object
                    required: [evento]
                    properties:
                      evento:
                        $ref: "#/components/schemas/EventoPublicacaoPedido"
              example:
                id: 42
                usuario: caio
                status: pendente
                itens:
                  - sku: APL-IP15-128
                    quantidade: 2
                    preco_unitario: "3999.00"
                    produto_id: 1
                total: "7998.00"
                idempotency_key: a1b2c3d4...
                tentativas: 0
                motivo_falha: ""
                created_at: "2026-08-10T14:05:00Z"
                updated_at: "2026-08-10T14:05:00Z"
                processado_em: null
                evento:
                  evento_id: 0f9c1e6c-3d2b-4a8e-9c77-12ab34cd56ef
                  broker: kafka
                  topico: pedidos.criados
                  fila: pedidos.criados
                  chave: "42"
                  particao: 2
                  offset: 17
                  duracao_ms: 3.1
                  ocorrido_em: 1759243200100
                  publicado_em: 1759243200123
        "200":
          description: Pedido já existente para a mesma Idempotency-Key
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pedido"
                  - type: object
                    required: [evento]
                    properties:
                      evento:
                        type: object
                        properties:
                          duplicado:
                            type: boolean
                            example: true
                          motivo:
                            type: string
                            example: pedido já existente
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/pedidos/{id}/:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: detalharPedido
      summary: Detalhar pedido (autenticado)
      description: Usuários comuns acessam apenas os próprios pedidos.
      tags:
        - pedidos
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XTraceId"
      responses:
        "200":
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pedido"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/pedidos/{id}/pagamento/:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: obterPagamento
      summary: Consultar pagamento do pedido (autenticado)
      description: |
        Polling do desfecho do pagamento. 404 se o pedido não existe ou ainda
        não tem pagamento registrado.
      tags:
        - pedidos
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XTraceId"
      responses:
        "200":
          description: Pagamento encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pagamento"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: simularPagamento
      summary: Simular pagamento e publicar PagamentoRegistrado (autenticado)
      description: |
        Simula o gateway (método + desfecho) e publica `PagamentoRegistrado`.

        * A chave de idempotência é **derivada no servidor** de
          `(pedido_id, metodo, aprovado)` — o header `Idempotency-Key` não entra.
        * `motivo_recusa` é obrigatório quando `aprovado=false` e proibido
          quando `aprovado=true`.
        * Re-POST da mesma tentativa: se o pagamento segue `registrado`,
          republica o evento e devolve `200` com `republicado: true`; se já
          resolvido, `200` com `republicado: false`.
        * Tentativa diferente (outro método/desfecho) para o mesmo pedido:
          `409` (OneToOne).
        * `X-Simular-Falha` (opcional, desenvolvimento).
      tags:
        - pedidos
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XSimularFalha"
        - $ref: "#/components/parameters/XTraceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagamentoSimular"
            examples:
              aprovado:
                summary: Pagamento aprovado via PIX
                value:
                  metodo: pix
                  aprovado: true
                  canal: email
              recusado:
                summary: Pagamento recusado no cartão de crédito
                value:
                  metodo: cartao_credito
                  aprovado: false
                  motivo_recusa: Cartão sem limite
                  canal: sms
      responses:
        "201":
          description: Pagamento registrado e evento publicado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagamento"
                  - type: object
                    required: [evento]
                    properties:
                      evento:
                        $ref: "#/components/schemas/EventoPublicacaoPagamento"
              example:
                id: 9
                pedido_id: 42
                usuario: caio
                metodo: pix
                valor: "7998.00"
                transacao_id: txn-0123456789abcdef
                aprovado: true
                motivo_recusa: ""
                status: registrado
                idempotency_key: b2c3d4e5...
                tentativas: 0
                motivo_falha: ""
                notificado_em: null
                created_at: "2026-08-10T14:10:00Z"
                updated_at: "2026-08-10T14:10:00Z"
                evento:
                  evento_id: 1aa2bb3c-4dd5-4e6f-8a90-1b2c3d4e5f60
                  broker: kafka
                  fluxo: pagamentos
                  topico: pagamentos.registrados
                  fila: pagamentos.registrados
                  chave: "42"
                  particao: 1
                  offset: 5
                  duracao_ms: 2.7
                  ocorrido_em: 1759243500100
                  publicado_em: 1759243500123
        "200":
          description: Tentativa repetida (republicação ou já resolvida)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Pagamento"
                  - type: object
                    properties:
                      evento:
                        $ref: "#/components/schemas/EventoPublicacaoPagamento"
                      republicado:
                        type: boolean
                        description: true se o evento foi republicado (pagamento ainda em `registrado`)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/notificacoes/:
    get:
      operationId: listarNotificacoes
      summary: Listar notificações (autenticado)
      description: |
        Usuários comuns veem apenas notificações dos próprios pedidos. Filtros
        `?pedido=<id>` e `?canal=email|sms`, busca (`?search=canal,titulo`),
        ordenação (`?sort=enviadaEm:desc`).
      tags:
