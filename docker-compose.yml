services:
  api:
    build: .
    container_name: synapseshop_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      # Aula 8: a API só sobe com o Redis saudável — assim o cache-aside
      # encontra o backend pronto. Ainda assim o código degrada para
      # "sem cache" se o Redis cair em tempo de execução (fail-open).
      redis:
        condition: service_healthy
    environment:
      # Variável mínima injetada: a API localiza o banco pelo nome do serviço 'db'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-synapseshop-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      # Aula 7: chave de assinatura do JWT injetada do .env via compose.
      # Vazio (padrão) => settings.py usa o DJANGO_SECRET_KEY como fallback.
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      # Aula 8 (cache-aside com Redis):
      #   REDIS_URL         -> host interno do serviço `redis`; db 1 é exclusivo
      #                        do cache da API (o db 0 fica livre para a Aula 9+).
      #   CACHE_ENABLED     -> false desliga o cache (baseline de desempenho).
      #   CACHE_TTL_LIST    -> TTL (s) das listagens (padrão da spec: 60s).
      #   CACHE_TTL_DETAIL  -> TTL (s) do detalhe/consulta pesada (spec: 300s).
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_LIST: ${CACHE_TTL_LIST:-60}
      CACHE_TTL_DETAIL: ${CACHE_TTL_DETAIL:-300}
      # Taxas de throttling da Aula 7 mantidas como padrão; parametrizáveis
      # para que a medição de RPS da Aula 8 não seja cortada por 429.
      DRF_ANON_RATE: ${DRF_ANON_RATE:-20/min}
      DRF_USER_RATE: ${DRF_USER_RATE:-100/min}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  db:
    image: postgres:16-alpine
    container_name: synapseshop_db
    restart: unless-stopped
    # Porta publicada para permitir comandos de gerenciamento local (venv):
    # makemigrations/migrate do Django contra localhost:5432 (ver README, Aula 6).
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapse}
      POSTGRES_DB: ${POSTGRES_DB:-synapse}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapse} -d ${POSTGRES_DB:-synapse}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: synapseshop_redis
    restart: unless-stopped
    # Porta publicada para inspeção local (redis-cli) e para o cache quando o
    # Django roda no venv local — mesmo padrão da 5432 do serviço `db`.
    ports:
      - "6379:6379"
    # Cache é dado DERIVADO e descartável: desligamos a persistência
    # (RDB e AOF) para não pagar I/O de disco a cada escrita. Se o Redis
    # reiniciar vazio, a API apenas repopula o cache (miss -> preenchimento).
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  inventory:
    build: ./services/inventory
    container_name: synapseshop_inventory
    restart: unless-stopped
    ports:
      - "8001:8001"
    # Aula 6: o inventory ganha persistência no PostgreSQL compartilhado com o
    # Django. Ele só inicia após o banco estar saudável; no startup aplica as
    # próprias migrações (Alembic) e o Django continua dono das próprias
    # tabelas (auth_user, core_*, ...) — sem conflito de versionamento.
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata: