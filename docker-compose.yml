services:
  api:
    build: .
    container_name: synapseshop_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      # Aula 8: a API só sobe com o Redis saudável — assim o cache-aside
      # encontra o backend pronto. Ainda assim o código degrada para
      # "sem cache" se o Redis cair em tempo de execução (fail-open).
      redis:
        condition: service_healthy
      # Aula 10: a API NÃO declara dependência do broker, e a mudança é
      # deliberada. Quem precisa do broker está no `depends_on` do
      # `worker-kafka`; aqui a dependência seria impossível de expressar,
      # porque o broker é escolhido por profile (kafka no padrão, rabbitmq no
      # profile `rabbitmq`) e `depends_on` não é condicional — exigir `kafka`
      # quebraria justamente a execução `docker compose --profile rabbitmq up`.
      #
      # O que substitui a dependãncia não é mágica: é o
      # caminho que a spec pede para demonstrar. Broker fora ⇒ POST responde
      # 503, o pedido fica em `pendente_publicacao`, e
      # `manage.py republicar_pedidos` publica o que ficou para trás. Esperar
      # o broker no startup só trocaria "503 explícito e recuperável" por
      # "container que não sobe".
    environment:
      # Variável mínima injetada: a API localiza o banco pelo nome do serviço 'db'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-synapseshop-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      # Aula 7: chave de assinatura do JWT injetada do .env via compose.
      # Vazio (padrão) => settings.py usa o DJANGO_SECRET_KEY como fallback.
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      # Aula 8 (cache-aside com Redis):
      #   REDIS_URL         -> host interno do serviço `redis`; db 1 é exclusivo
      #                        do cache da API (o db 0 fica livre para a Aula 9+).
      #   CACHE_ENABLED     -> false desliga o cache (baseline de desempenho).
      #   CACHE_TTL_LIST    -> TTL (s) das listagens (padrão da spec: 60s).
      #   CACHE_TTL_DETAIL  -> TTL (s) do detalhe/consulta pesada (spec: 300s).
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_LIST: ${CACHE_TTL_LIST:-60}
      CACHE_TTL_DETAIL: ${CACHE_TTL_DETAIL:-300}
      # Taxas de throttling da Aula 7 mantidas como padrão; parametrizáveis
      # para que a medição de RPS da Aula 8 não seja cortada por 429.
      DRF_ANON_RATE: ${DRF_ANON_RATE:-20/min}
      DRF_USER_RATE: ${DRF_USER_RATE:-100/min}
      # Aula 9 (mensageria assíncrona com RabbitMQ):
      #   RABBITMQ_URL -> conexão AMQP com o broker. Publicar é parte do
      #                   contrato do POST /pedidos: se o broker não estiver
      #                   lá, a API responde 503 em vez de fingir sucesso.
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-synapse}:${RABBITMQ_PASSWORD:-synapse}@rabbitmq:5672/%2F
      #   REDIS_URL_DEDUPE -> db 0, exclusivo da janela de idempotência da
      #                        Aula 9 (o db 1 é o cache-aside da Aula 8).
      REDIS_URL_DEDUPE: ${REDIS_URL_DEDUPE:-redis://redis:6379/0}
      # Aula 10 (Kafka):
      #   MENSAGERIA_BROKER        -> 'kafka' (padrão) ou 'rabbitmq'. É a
      #                               única variável que troca o transporte em
      #                               todo o projeto (ver core/messaging/broker.py).
      MENSAGERIA_BROKER: ${MENSAGERIA_BROKER:-kafka}
      #   KAFKA_BOOTSTRAP_SERVERS  -> fixado no listener INTERNO. Dentro do
      #                               compose o broker é o serviço `kafka`, e
      #                               deixar o `.env` sobrescrever apontaria a
      #                               API para o `localhost` dela mesma (que é
      #                               justamente onde o listener EXTERNO está
      #                               publicado, mas não dentro da rede do
      #                               compose). No host/venv local, use
      #                               `localhost:9092` — ver as settings.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      #   Topologia: declarada pela APLICAÇÃO (o broker roda com
      #   auto.create.topics.enable=false). Partições é o eixo de paralelismo e
      #   não pode mudar depois que o tópico existe.
      KAFKA_PARTICOES: ${KAFKA_PARTICOES:-3}
      KAFKA_REPLICAS: ${KAFKA_REPLICAS:-1}
      KAFKA_RETENCAO_MS: ${KAFKA_RETENCAO_MS:-604800000}
      KAFKA_RETENCAO_DLQ_MS: ${KAFKA_RETENCAO_DLQ_MS:-2592000000}
      KAFKA_TOPICO_PEDIDOS: ${KAFKA_TOPICO_PEDIDOS:-pedidos.criados}
      KAFKA_TOPICO_DLQ: ${KAFKA_TOPICO_DLQ:-pedidos.criados.dlq}
      KAFKA_GRUPO_CONSUMIDORES: ${KAFKA_GRUPO_CONSUMIDORES:-synapseshop-pedidos}
      KAFKA_GRUPO_REPLAY: ${KAFKA_GRUPO_REPLAY:-synapseshop-replay}
      # `earliest` é o que permite o teste de replay reler o histórico já
      # publicado. Em produção o padrão seguro seria `latest` (ver README).
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET:-earliest}
      #   Política de reentrega e DLQ: 1 tentativa inicial + 3 reentregas
      #   (5s -> 15s -> 45s) e depois a DLQ. Ver README (Aulas 9 e 10).
      DEDUPE_TTL_SEGUNDOS: ${DEDUPE_TTL_SEGUNDOS:-86400}
      PEDIDO_MAX_REENTREGAS: ${PEDIDO_MAX_REENTREGAS:-3}
      PEDIDO_BACKOFF_SEGUNDOS: ${PEDIDO_BACKOFF_SEGUNDOS:-5,15,45}
      # `X-Simular-Falha` é o gancho que valida a DLQ de ponta a ponta. true
      # só em desenvolvimento — fora dele o header é ignorado pela API.
      PEDIDO_PERMITIR_SIMULACAO_FALHA: ${PEDIDO_PERMITIR_SIMULACAO_FALHA:-true}
      # Aula 11: o MESMO header, na MESMA variável, no POST de pagamento. É a
      # mesma sabotagem de propósito — quem lê o README quer distinguir "a
      # escada de reentrega funciona" de "a escada funciona", não fabricar dois
      # interruptores para o mesmo efeito. E precisa estar aqui (na API), não só
      # no worker: é a API que decide ignorar o header, e worker com a flag
      # ligada + API sem ela produziria pagamento com `simular_falha=false` e uma
      # DLQ inexplicável — que foi exatamente o que aconteceu na validação.
      PAGAMENTO_PERMITIR_SIMULACAO_FALHA: ${PAGAMENTO_PERMITIR_SIMULACAO_FALHA:-true}
      MESSAGERIA_LOG_LEVEL: ${MESSAGERIA_LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  db:
    image: postgres:16-alpine
    container_name: synapseshop_db
    restart: unless-stopped
    # Porta publicada para permitir comandos de gerenciamento local (venv):
    # makemigrations/migrate do Django contra localhost:5432 (ver README, Aula 6).
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapse}
      POSTGRES_DB: ${POSTGRES_DB:-synapse}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapse} -d ${POSTGRES_DB:-synapse}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: synapseshop_redis
    restart: unless-stopped
    # Porta publicada para inspeção local (redis-cli) e para o cache quando o
    # Django roda no venv local — mesmo padrão da 5432 do serviço `db`.
    ports:
      - "6379:6379"
    # Cache é dado DERIVADO e descartável: desligamos a persistência
    # (RDB e AOF) para não pagar I/O de disco a cada escrita. Se o Redis
    # reiniciar vazio, a API apenas repopula o cache (miss -> preenchimento).
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  inventory:
    build: ./services/inventory
    container_name: synapseshop_inventory
    restart: unless-stopped
    ports:
      - "8001:8001"
    # Aula 6: o inventory ganha persistência no PostgreSQL compartilhado com o
    # Django. Ele só inicia após o banco estar saudável; no startup aplica as
    # próprias migrações (Alembic) e o Django continua dono das próprias
    # tabelas (auth_user, core_*, ...) — sem conflito de versionamento.
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  kafka:
    image: apache/kafka:3.9.1
    container_name: synapseshop_kafka
    restart: unless-stopped
    # Aula 10: broker único em KRaft (sem ZooKeeper), com DOIS listeners.
    #   29092 -> listener INTERNO, anunciado como `kafka` (o nome do serviço
    #            resolve na rede do compose: é o que a API e o worker usam).
    #   9092  -> listener EXTERNO, anunciado como `localhost` (é o que o host
    #            alcança, para o venv local e o scripts/measure_messaging.py).
    #
    # A separação não é detalhe: o Kafka anuncia o endereço ao cliente no
    #(metadata do broker), e um único listener anunciado como `localhost`
    # faria o container se reconectar a si mesmo. Dois listeners, dois
    # endereços anunciados — o mesmo cliente funciona nos dois contextos.
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      # `broker,controller` no mesmo processo: é o modo standalone do KRaft,
      # suficiente para a aula e sem a necessidade de um segundo nó de
      # quorum. Em cluster real os papéis e o `CONTROLLER_QUORUM_VOTERS` mudam.
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      # Tópicos internos em 1 réplica: com um broker só, o padrão (3) faz o
      # cluster não ficar pronto.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 0 = sem espera de rebalance na entrada do grupo. É o que permite
      # escalar `worker-kafka` e ver as partições se moverem imediatamente,
      # que é o que a medição de paralelismo precisa.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Aula 10: quem cria os tópicos é a APLICAÇÃO (ver
      # `manage.py declarar_topicos_kafka`), porque partições e `retention.ms`
      # são parâmetros que a spec pede para demonstrar, não defaults de
      # servidor. Com auto-create ligado, viria 1 partição e retenção padrão.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      # O volume é o que faz o log SER um log: sem ele, reiniciar o container
      # perde o histórico e o teste de replay não tem o que reler.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      # Usa a própria CLI do broker (o `bash` com /dev/tcp não é garantido na
      # imagem JRE slim) e testa o listener EXTERNO, que é o mesmo caminho que
      # o host usa.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  worker-kafka:
    build: .
    # Aula 10: SEM `container_name`, pelo mesmo motivo que o `worker` da
    # Aula 9 não tem: com nome fixo o Compose recusa `--scale`, e sem escala
    # não há como medir o paralelismo (no Kafka, N consumidores para N
    # partições — o eixo é a partição, não a fila).
    restart: unless-stopped
    command: ["python", "api/manage.py", "consumir_pedidos"]
    depends_on:
      # Quem aplica as migrações no startup é a API (ver Dockerfile), então o
      # worker espera a API ficar saudável para não consumir antes das tabelas
      # existirem. `restart: unless-stopped` cobre o caso inverso.
      api:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-synapse}:${POSTGRES_PASSWORD:-synapse}@db:5432/${POSTGRES_DB:-synapse}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-synapseshop-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      # Aula 10: Kafka (padrão). `KAFKA_BOOTSTRAP_SERVERS` não é lido do `.env`
      # aqui de propósito — dentro do compose o valor correto é o listener
      # interno, e permitir que o `.env` sobrescreva faria a API procurar o
      # broker em `localhost` (que é ela mesma) em vez do serviço `kafka`.
      MENSAGERIA_BROKER: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_PARTICOES: ${KAFKA_PARTICOES:-3}
      KAFKA_REPLICAS: ${KAFKA_REPLICAS:-1}
      KAFKA_TOPICO_PEDIDOS: ${KAFKA_TOPICO_PEDIDOS:-pedidos.criados}
      KAFKA_TOPICO_DLQ: ${KAFKA_TOPICO_DLQ:-pedidos.criados.dlq}
      KAFKA_GRUPO_CONSUMIDORES: ${KAFKA_GRUPO_CONSUMIDORES:-synapseshop-pedidos}
      KAFKA_GRUPO_REPLAY: ${KAFKA_GRUPO_REPLAY:-synapseshop-replay}
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET:-earliest}
      # Aula 10: o worker usa a MESMA janela de idempotência da API — é ela
      # que impede o efeito duplicado, e quem escreve é o consumidor. Sem
      # esta variável o dedupe cairia no default `localhost:6379` (o próprio
      # container do worker), degradaria para fail-open a cada mensagem e o
      # log de `DedupeDegradado` viraria ruído. O `redis` não entra em
      # `depends_on` de propósito: o dedupe é fail-open e o worker precisa
      # subir e reprocessar mesmo com o Redis fora.
      REDIS_URL_DEDUPE: ${REDIS_URL_DEDUPE:-redis://redis:6379/0}
      DEDUPE_TTL_SEGUNDOS: ${DEDUPE_TTL_SEGUNDOS:-86400}
      PEDIDO_MAX_REENTREGAS: ${PEDIDO_MAX_REENTREGAS:-3}
      PEDIDO_BACKOFF_SEGUNDOS: ${PEDIDO_BACKOFF_SEGUNDOS:-5,15,45}
      MESSAGING_LOG_LEVEL: ${MESSAGING_LOG_LEVEL:-INFO}
      DRF_ANON_RATE: ${DRF_ANON_RATE:-20/min}
      DRF_USER_RATE: ${DRF_USER_RATE:-100/min}

  # Aula 11: worker do SEGUNDO fluxo (`pagamentos.registrados`). Mesma imagem,
  # mesmo comando, mesmo código — o que muda é o `--fluxo`, e é por isso que
  # este serviço é uma cópia quase idêntica do `worker-kafka` em vez de um
  # microsserviço novo. Tópico, grupo e DLQ são próprios: ver a justificativa em
  # `api/config/settings.py`.
  worker-pagamentos:
    build: .
    # Sem `container_name`, pelo mesmo motivo do `worker-kafka` (permite
    # `--scale worker-pagamentos=3` e medir o paralelismo do segundo fluxo).
    restart: unless-stopped
    command: ["python", "api/manage.py", "consumir_pedidos", "--fluxo", "pagamentos"]
    depends_on:
      api:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-synapse}:${POSTGRES_PASSWORD:-synapse}@db:5432/${POSTGRES_DB:-synapse}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-synapseshop-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      MENSAGERIA_BROKER: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_PARTICOES: ${KAFKA_PARTICOES:-3}
      KAFKA_REPLICAS: ${KAFKA_REPLICAS:-1}
      # Topologia própria do fluxo. As settings abaixo têm os mesmos defaults do
      # fluxo de pedidos justamente para o caso de alguém rodar só este serviço.
      KAFKA_TOPICO_PAGAMENTOS: ${KAFKA_TOPICO_PAGAMENTOS:-pagamentos.registrados}
      KAFKA_TOPICO_PAGAMENTOS_DLQ: ${KAFKA_TOPICO_PAGAMENTOS_DLQ:-pagamentos.registrados.dlq}
      KAFKA_PARTICOES_PAGAMENTOS: ${KAFKA_PARTICOES_PAGAMENTOS:-3}
      KAFKA_GRUPO_PAGAMENTOS: ${KAFKA_GRUPO_PAGAMENTOS:-synapseshop-pagamentos}
      KAFKA_GRUPO_PAGAMENTOS_REPLAY: ${KAFKA_GRUPO_PAGAMENTOS_REPLAY:-synapseshop-pagamentos-replay}
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET:-earliest}
      REDIS_URL_DEDUPE: ${REDIS_URL_DEDUPE:-redis://redis:6379/0}
      DEDUPE_TTL_SEGUNDOS: ${DEDUPE_TTL_SEGUNDOS:-86400}
      # Política de reentrega COMPARTILHADA com o fluxo de pedidos: os dois
      # precisam do mesmo comportamento, e duas escadas configuráveis seriam
      # duas chances de divergir. Só o que muda é o nome dos tópicos de retry,
      # que nasce do tópico base.
      PEDIDO_MAX_REENTREGAS: ${PEDIDO_MAX_REENTREGAS:-3}
      PEDIDO_BACKOFF_SEGUNDOS: ${PEDIDO_BACKOFF_SEGUNDOS:-5,15,45}
      # `PAGAMENTO_PERMITIR_SIMULACAO_FALHA` NÃO entra aqui, e a ausência é
      # proposital: ela é consultada só pela API, que decide se aceita o header
      # `X-Simular-Falha` e grava `simular_falha` no pagamento. O worker honra a
      # marcação gravada, igual ao `worker-kafka` no fluxo de pedidos — é o
      # mesmo desenho nos dois. Colocar a flag aqui criaria a promessa de um
      # interruptor de worker que não existe.
      MESSAGING_LOG_LEVEL: ${MESSAGERIA_LOG_LEVEL:-INFO}
      DRF_ANON_RATE: ${DRF_ANON_RATE:-20/min}
      DRF_USER_RATE: ${DRF_USER_RATE:-100/min}

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: synapseshop_rabbitmq
    restart: unless-stopped
    # Aula 10: o RabbitMQ virou OPTIONAL e vive no profile `rabbitmq` — o
    # broker padrão da aula é o Kafka. Ver o README, "Rodando com RabbitMQ".
    profiles: ["rabbitmq"]
    # 5672 = AMQP (os processos da aplicação); 15672 = management web, usada
    # para inspecionar filas/DLQ na validação e pelo scripts/measure_messaging.py.
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      # Aula 9: usuário de aplicação criado no 1º start. O `guest` padrão do
      # RabbitMQ só aceita conexão de localhost, então um serviço em outro
      # container precisa de credencial própria.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-synapse}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-synapse}
    # Fila de pedidos é dado de NEGÓCIO (não dado derivado): se o broker
    # reiniciar, o que está na fila tem de sobreviver. Mantemos o volume
    # nomeado e as confirmações de publicação no produtor (publisher
    # confirms) para não perder evento em queda do container.
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  worker:
    build: .
    # Aula 10: SEM `container_name`. É o único jeito de o Compose conseguir
    # criar mais de um worker (`docker compose up -d --scale worker=3`), que é
    # como se mede o paralelismo: N consumidores na MESMA fila, atendidos em
    # round-robin pelo broker. Com nome fixo o Compose se recusa a escalar, e o
    # ganho de processar com mais de um consumidor fica impossível de medir.
    restart: unless-stopped
    # Aula 10: profile `rabbitmq` — este worker só existe quando o broker
    # escolhido é o RabbitMQ da Aula 9. Sem o profile ele não sobe junto com
    # `docker compose up -d`, que é o comportamento desejado: no caminho
    # padrão quem consome é o `worker-kafka`.
    profiles: ["rabbitmq"]
    # Aula 9: o consumidor do evento `PedidoCriado`. Mesma imagem da API de
    # propósito — é o mesmo código Django, os mesmos models e as mesmas
    # migrações; só o comando de entrada muda (um management command em vez
    # do gunicorn). Um microsserviço separado aqui exigiria duplicar a
    # modelagem de Pedido em um segundo ORM.
    command: ["python", "api/manage.py", "consumir_pedidos"]
    depends_on:
      # Quem aplica as migrações no startup é a API (ver Dockerfile), então o
      # worker espera a API ficar saudável para não consumir antes das tabelas
      # existirem. `restart: unless-stopped` cobre o caso inverso.
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-synapse}:${POSTGRES_PASSWORD:-synapse}@db:5432/${POSTGRES_DB:-synapse}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-synapseshop-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-synapse}:${RABBITMQ_PASSWORD:-synapse}@rabbitmq:5672/%2F
      # Aula 10: transporte FIXO (RabbitMQ), pelo mesmo motivo do
      # `worker-kafka` — produtor e consumidor não podem cair em brokers
      # diferentes por causa de um `.env` editado no meio da sessão.
      MENSAGERIA_BROKER: rabbitmq
      REDIS_URL_DEDUPE: ${REDIS_URL_DEDUPE:-redis://redis:6379/0}
      DEDUPE_TTL_SEGUNDOS: ${DEDUPE_TTL_SEGUNDOS:-86400}
      PEDIDO_MAX_REENTREGAS: ${PEDIDO_MAX_REENTREGAS:-3}
      PEDIDO_BACKOFF_SEGUNDOS: ${PEDIDO_BACKOFF_SEGUNDOS:-5,15,45}
      MESSAGING_LOG_LEVEL: ${MESSAGING_LOG_LEVEL:-INFO}
      # Taxas de throttling sem efeito aqui (o worker não faz requisições
      # HTTP), mas mantidas para o settings não cair em defaults diferentes.
      DRF_ANON_RATE: ${DRF_ANON_RATE:-20/min}
      DRF_USER_RATE: ${DRF_USER_RATE:-100/min}

volumes:
  pgdata:
  rabbitmqdata:
  kafkadata:
